[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-browser-mcp"
version = "0.1.0"
description = "Universal, ultra-fast CDP-based browser automation MCP server with multi-action batching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=11.0",
    "requests>=2.28.0"
]

[project.scripts]
fast-browser = "fast_browser.cli:main"
fast-browser-mcp = "fast_browser.server:main"
