[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-browser-mcp"
version = "0.12.0"
description = "Universal, ultra-fast CDP-based browser automation MCP server with multi-action batching, Shadow DOM traversal, multimodal images, and full browser control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kqlio67" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "chrome-devtools-protocol",
    "cdp",
    "browser-automation",
    "agentic-ai",
    "fast-browser",
    "shadow-dom",
    "reverse-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "websockets>=11.0",
    "requests>=2.28.0",
    "aiofiles>=23.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "types-aiofiles>=23.2.0",
    "types-requests>=2.28.0"
]

[project.scripts]
fast-browser = "fast_browser.cli:main"
fast-browser-mcp = "fast_browser.server:main"

[project.urls]
Homepage = "https://github.com/kqlio67/fast-browser-mcp"
Repository = "https://github.com/kqlio67/fast-browser-mcp.git"
Issues = "https://github.com/kqlio67/fast-browser-mcp/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
    "types-aiofiles>=23.2.0",
    "types-requests>=2.28.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fast_browser*"]
exclude = ["tests*", "skills*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
